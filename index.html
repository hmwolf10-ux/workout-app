<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1116">
  <meta name="color-scheme" content="dark light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Workout">
  <title>Workout Tracker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <main id="view" tabindex="-1"></main>
  <button id="resumeBar" data-act="resume" hidden></button>
  <div id="rest" hidden role="timer" aria-label="Rest timer">
    <span class="label">Rest</span><strong id="restTime">0:00</strong>
    <button data-act="rest-add">+30s</button><button data-act="rest-skip">Skip</button>
  </div>
  <nav id="nav" aria-label="Main"></nav>
  <div id="sheet" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript><p style="padding:24px">This app needs JavaScript.</p></noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
