<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Workout Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
      font-size: 14px;
      line-height: 1.4;
    }

    .container {
      width: 100%;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .header {
      padding: 0;
      background: #0d0d0d;
      border-bottom: 1px solid #2a2a2a;
      display: flex;
      flex-direction: column;
    }

    .header-top {
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
      flex: 1;
    }
    .header h1 { font-size: 16px; font-weight: 600; letter-spacing: 0; }
    .header .date { font-size: 12px; color: #666; display: none; }
    .day-select {
      background: #0d0d0d;
      border: 1px solid #2a2a2a;
      color: #e0e0e0;
      padding: 6px 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      border-radius: 3px;
    }
    .day-select:hover {
      color: #fff;
      border-color: #444;
    }
    .day-select option {
      background: #1a1a1a;
      color: #e0e0e0;
    }
    .day-select.header-select {
      display: none;
    }

    .workout-header-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #2a2a2a;
    }
    .workout-header-section label {
      font-size: 12px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
      margin-right: 8px;
    }
    .header-timer {
      font-size: 14px;
      color: #2563eb;
      font-weight: 600;
      min-width: 60px;
      text-align: right;
    }
    .header-right {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .nav-tabs {
      display: flex;
      gap: 0;
      background: #0d0d0d;
      border-top: 1px solid #2a2a2a;
      padding: 0 24px;
      overflow-x: auto;
    }

    .nav-tab {
      padding: 12px 0;
      margin: 0 12px;
      background: none;
      border: none;
      color: #666;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.15s;
      font-family: inherit;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .nav-tab:hover { color: #aaa; }

    .nav-tab.active {
      color: #e0e0e0;
      border-bottom-color: #2563eb;
    }

    .start-btn {
      padding: 6px 16px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 3px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      font-family: inherit;
      white-space: nowrap;
    }
    .start-btn:hover { background: #1e40af; }
    .start-btn.active { background: #dc2626; }
    .start-btn.secondary { background: #2a2a2a; }
    .start-btn.secondary:hover { background: #333; }

    .auth-btn {
      padding: 6px 12px;
      background: #666;
      color: white;
      border: none;
      border-radius: 3px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .auth-btn:hover { background: #777; }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 16px 24px;
      display: none;
    }

    .content.active {
      display: block;
    }

    .exercise-block {
      margin-top: 32px;
      margin-bottom: 0;
    }
    .exercise-block:first-of-type {
      margin-top: 0;
    }

    .exercise-title {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .exercise-meta {
      font-size: 12px;
      color: #666;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .set-controls {
      display: flex;
      gap: 4px;
    }
    .set-btn {
      width: 24px;
      height: 24px;
      padding: 0;
      background: #2a2a2a;
      color: #888;
      border: 1px solid #2a2a2a;
      border-radius: 3px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.15s;
    }
    .set-btn:hover { background: #333; color: #aaa; border-color: #444; }

    .sets-table {
      width: 100%;
      border-collapse: collapse;
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      overflow: hidden;
      box-sizing: border-box;
    }

    .last-week-table {
      width: 100%;
      border-collapse: collapse;
      background: #1a1a1a;
      border: 1px solid #2a3a3a;
      border-radius: 8px;
      overflow: hidden;
      box-sizing: border-box;
      margin-top: 6px;
    }

    .set-row {
      display: grid;
      grid-template-columns: 35px 1fr 1fr 1fr auto;
      gap: 6px;
      padding: 8px 8px;
      border-bottom: 1px solid #2a2a2a;
      align-items: center;
      background: #111;
      width: 100%;
      box-sizing: border-box;
    }
    .set-row:hover { background: #1a1a1a; }
    .set-row > * {
      min-width: 0;
      overflow: hidden;
    }

    .last-week-row {
      display: grid;
      grid-template-columns: 24px 1fr 1fr 1fr auto;
      gap: 4px;
      padding: 4px 6px;
      border-bottom: 1px solid #1a3a2a;
      align-items: center;
      background: #0d0d0d;
      width: 100%;
      box-sizing: border-box;
      color: #888;
      font-size: 12px;
    }

    .set-rec-row {
      display: grid;
      grid-template-columns: 35px 1fr 1fr 1fr auto;
      gap: 6px;
      padding: 8px 8px;
      border-bottom: 1px solid #2a2a2a;
      align-items: center;
      background: #1a2a4a;
      cursor: pointer;
      transition: background 0.15s;
      width: 100%;
      box-sizing: border-box;
    }
    .set-rec-row:hover { background: #2a3a5a; }
    .set-rec-row > * {
      min-width: 0;
      overflow: hidden;
    }

    .warmup-btn {
      padding: 4px 16px;
      background: #2a2a2a;
      color: #888;
      border: none;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      margin-bottom: 8px;
      transition: all 0.15s;
      font-family: inherit;
    }
    .warmup-btn:hover { background: #333; color: #aaa; }
    .warmup-table {
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      margin-bottom: 12px;
      overflow: hidden;
    }
    .warmup-header {
      background: #0d0d0d;
      padding: 8px 8px;
      border-bottom: 1px solid #2a2a2a;
      display: grid;
      grid-template-columns: 35px 1fr 1fr 1fr;
      gap: 6px;
      font-size: 11px;
      color: #666;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .warmup-header > div {
      text-align: center;
    }
    .warmup-row {
      display: grid;
      grid-template-columns: 35px 1fr 1fr 1fr;
      gap: 6px;
      padding: 8px 8px;
      border-bottom: 1px solid #2a2a2a;
      align-items: center;
      color: #e0e0e0;
      font-size: 12px;
    }
    .warmup-row > div {
      text-align: center;
    }
    .warmup-row:last-child { border-bottom: none; }
    .warmup-context {
      padding: 8px;
      font-size: 11px;
      color: #666;
      background: #0d0d0d;
      border-top: 1px solid #2a2a2a;
    }

    .rec-val {
      text-align: center;
      color: #60a5fa;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
    }

    .set-header {
      display: grid;
      grid-template-columns: 35px 1fr 1fr 1fr auto;
      gap: 6px;
      padding: 8px 8px;
      background: #0d0d0d;
      border-bottom: 1px solid #2a2a2a;
      font-size: 11px;
      color: #666;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      width: 100%;
      box-sizing: border-box;
    }
    .set-header > div {
      text-align: center;
      width: 100%;
    }
    .set-header > * {
      min-width: 0;
      overflow: hidden;
    }
    .set-header > * {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .set-header-cell {
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
    }

    .last-week-header {
      display: grid;
      grid-template-columns: 24px 1fr 1fr 1fr auto;
      gap: 4px;
      padding: 4px 6px;
      background: #0d0d0d;
      border-bottom: 1px solid #1a3a2a;
      font-size: 9px;
      color: #555;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      width: 100%;
      box-sizing: border-box;
    }
    .last-week-header > * {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .set-num {
      font-size: 12px;
      color: #666;
      font-weight: 500;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .input-field {
      background: #0d0d0d;
      border: 1px solid #2a2a2a;
      color: #e0e0e0;
      padding: 6px 4px;
      border-radius: 3px;
      font-size: 13px;
      font-family: inherit;
      font-weight: 500;
      text-align: center;
      text-align-last: center;
      height: 28px;
      line-height: 16px;
      transition: border-color 0.15s;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      box-sizing: border-box;
      display: block;
      margin: 0;
    }
    .input-field:focus {
      outline: none;
      border-color: #2563eb;
      background: #1a1a1a;
    }
    .input-field:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .checkbox {
      width: 28px;
      height: 28px;
      cursor: pointer;
      accent-color: #2563eb;
      flex-shrink: 0;
    }
    .checkbox:disabled {
      cursor: not-allowed;
      opacity: 0.4;
    }

    select.input-field {
      appearance: none;
      padding: 6px 4px !important;
      background-image: none;
      text-align: center;
      text-align-last: center;
      line-height: 16px !important;
      height: 28px !important;
      margin: 0 !important;
    }

    .timer-display {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #0d0d0d;
      border-top: 1px solid #2563eb;
      padding: 12px 16px;
      text-align: center;
      z-index: 1000;
      display: none;
      transform: translateY(100%);
      transition: transform 0.2s ease-out;
    }
    .timer-display.active {
      display: flex;
      transform: translateY(0);
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .timer-time {
      font-size: 24px;
      font-weight: 600;
      font-family: inherit;
      color: #2563eb;
      min-width: 80px;
    }
    .timer-label {
      font-size: 12px;
      color: #888;
    }
    .timer-controls {
      display: flex;
      gap: 8px;
    }
    .timer-btn {
      padding: 6px 12px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 3px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      font-family: inherit;
    }
    .timer-btn:hover { background: #1e40af; }
    .timer-close {
      padding: 4px 8px;
      background: transparent;
      color: #888;
      border: 1px solid #2a2a2a;
      border-radius: 3px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
    }
    .timer-close:hover { color: #e0e0e0; border-color: #444; }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #666;
    }
    .empty-state p { font-size: 13px; }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }
    .modal {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 24px;
      max-width: 800px;
      max-height: 80vh;
      overflow-y: auto;
      color: #e0e0e0;
    }
    .modal h2 {
      font-size: 18px;
      margin-bottom: 16px;
      font-weight: 600;
    }
    .modal p {
      font-size: 13px;
      color: #999;
      margin-bottom: 24px;
    }
    .modal-buttons {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }
    .modal-btn {
      padding: 8px 16px;
      border: 1px solid #2a2a2a;
      border-radius: 3px;
      background: #0d0d0d;
      color: #e0e0e0;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.15s;
      font-family: inherit;
    }
    .modal-btn:hover { background: #1a1a1a; border-color: #444; }
    .modal-btn.save {
      background: #2563eb;
      border-color: #2563eb;
      color: white;
    }
    .modal-btn.save:hover { background: #1e40af; }

    .last-week-label {
      font-size: 9px;
      color: #555;
      margin-top: 8px;
      margin-bottom: 2px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .settings-row {
      margin-bottom: 12px;
      padding: 12px;
      background: #111;
      border-radius: 4px;
      border: 1px solid #2a2a2a;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .settings-row label {
      font-size: 12px;
      color: #999;
      font-weight: 600;
      min-width: 120px;
    }
    .settings-row input {
      width: 80px;
      padding: 6px 8px;
      background: #0d0d0d;
      border: 1px solid #2a2a2a;
      color: #e0e0e0;
      border-radius: 3px;
      font-size: 13px;
      text-align: center;
    }
    .settings-row span {
      font-size: 12px;
      color: #666;
    }

    @media (max-width: 600px) {
      .set-row {
        grid-template-columns: 28px 1fr 1fr 1fr auto;
        gap: 5px;
        padding: 8px 6px;
      }
      .set-header {
        grid-template-columns: 28px 1fr 1fr 1fr auto;
        gap: 5px;
        padding: 8px 6px;
      }
      .set-rec-row {
        grid-template-columns: 28px 1fr 1fr 1fr auto;
        gap: 5px;
        padding: 6px 6px;
      }
      .last-week-row {
        grid-template-columns: 24px 1fr 1fr 1fr auto;
        gap: 4px;
        padding: 4px 6px;
        font-size: 11px;
      }
      .last-week-header {
        grid-template-columns: 24px 1fr 1fr 1fr auto;
        gap: 4px;
        padding: 3px 6px;
        font-size: 8px;
      }
      .input-field {
        font-size: 12px;
        padding: 6px 3px;
        text-align: center;
        min-width: 0;
        overflow: hidden;
      }
      .rec-val {
        font-size: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .exercise-meta { font-size: 11px; }
      .rec-text { display: none; }
      .header-top { padding: 12px 16px; }
      .day-select { font-size: 14px; }
      .nav-tabs { padding: 0 16px; }
      .nav-tab { margin: 0 8px; }
    }

    @media (max-width: 380px) {
      body {
        font-size: 13px;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      .container {
        padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;
      }
      .header-top {
        padding: 8px 12px;
        padding-top: max(8px, env(safe-area-inset-top));
        padding-right: max(12px, env(safe-area-inset-right));
        padding-left: max(12px, env(safe-area-inset-left));
        flex-wrap: wrap;
        gap: 8px;
      }
      .header-left {
        flex: 1 1 100%;
        gap: 8px;
      }
      .header-right {
        flex: 1 1 auto;
        gap: 4px;
      }
      .start-btn {
        padding: 5px 10px;
        font-size: 11px;
        white-space: normal;
        flex: 1;
        min-width: 60px;
      }
      .day-select {
        padding: 5px 6px;
        font-size: 13px;
      }
      .header-timer {
        font-size: 12px;
        min-width: 50px;
      }
      .content {
        padding: 12px 16px;
        padding-left: max(12px, env(safe-area-inset-left));
        padding-right: max(12px, env(safe-area-inset-right));
      }
      .set-row, .set-header, .set-rec-row {
        grid-template-columns: 24px 0.8fr 0.8fr 0.8fr auto;
        gap: 3px;
        padding: 6px 4px;
      }
      .input-field {
        font-size: 11px;
        padding: 4px 2px;
        height: 24px;
        line-height: 14px;
      }
      .checkbox {
        width: 24px;
        height: 24px;
      }
      .exercise-title {
        font-size: 14px;
        flex-direction: column;
        gap: 6px;
      }
      .exercise-meta {
        font-size: 10px;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
      }
      .set-controls {
        gap: 2px;
      }
      .set-btn {
        width: 20px;
        height: 20px;
        font-size: 10px;
      }
      .timer-display {
        padding: 10px 12px;
        padding-left: max(12px, env(safe-area-inset-left));
        padding-right: max(12px, env(safe-area-inset-right));
        padding-bottom: max(10px, env(safe-area-inset-bottom));
        gap: 8px;
      }
      .timer-time {
        font-size: 20px;
        min-width: 60px;
      }
      .timer-btn {
        padding: 4px 8px;
        font-size: 11px;
      }
      .modal {
        border-radius: 12px;
        padding: 16px;
        margin: 16px;
      }
      .modal-btn {
        padding: 6px 12px;
        font-size: 12px;
      }
      .warmup-btn {
        padding: 3px 12px;
        font-size: 11px;
        margin-bottom: 6px;
      }
      .nav-tabs { padding: 0 12px; }
      .nav-tab { margin: 0 6px; font-size: 11px; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="header-top">
      <div class="header-left">
        <h1>💪 Workout</h1>
      </div>
      <div class="header-timer" id="workoutTimer" style="display:none;">0:00</div>
      <div class="header-right">
        <button class="start-btn" id="startBtn" onclick="toggleWorkout()">Start Workout</button>
        <button class="auth-btn" id="authBtn" onclick="handleAuth()" style="margin-left: 8px;">Sign in</button>
      </div>
    </div>
    <div class="nav-tabs">
      <button class="nav-tab active" onclick="showPage('workout')">Workout</button>
      <button class="nav-tab" onclick="showPage('progress')">Progress</button>
      <button class="nav-tab" onclick="showPage('history')">History</button>
      <button class="nav-tab" onclick="showPage('settings')">Settings</button>
    </div>
  </div>

  <div class="content active" id="workoutPage"></div>
  <div class="content" id="progressPage"></div>
  <div class="content" id="historyPage"></div>
  <div class="content" id="settingsPage"></div>
</div>

<div class="timer-display" id="timerDisplay">
  <div class="timer-time" id="timerTime">0:00</div>
  <div class="timer-label">Rest</div>
  <div class="timer-controls">
    <button class="timer-btn" onclick="toggleTimer()">Pause</button>
    <button class="timer-btn" onclick="skipTimer()">Skip</button>
  </div>
  <button class="timer-close" onclick="skipTimer()">×</button>
</div>

<div class="modal-overlay" id="endWorkoutModal" style="display: none;">
  <div class="modal" style="max-width: 400px;">
    <h2>End Workout</h2>
    <p>Do you want to save this workout or discard it?</p>
    <div class="modal-buttons">
      <button class="modal-btn" onclick="discardWorkout()">Discard</button>
      <button class="modal-btn save" onclick="saveAndEndWorkout()">Save</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="swapExerciseModal" style="display: none;">
  <div class="modal" style="max-width: 500px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h2>Swap Exercise</h2>

}

      const exLib = EXERCISE_LIBRARY[progEx.name];
      return {
        name: progEx.name,
        type: exLib ? exLib.type : 'weighted',
        sets: Array(progEx.sets).fill(null).map(() => ({ w: null, r: null, rir: null, logged: false, recViewed: false }))
      };
    });
  }
}

      if (!exData[exIdx].sets[setIdx].logged) {

function saveSet(exIdx, setIdx, field, value) {
  const exData = workoutData[`${todayISO()}-${currentDay}`];
  const set = exData[exIdx].sets[setIdx];

  if (field === 'w') {
    const parsed = value ? parseInt(value) : null;
    set.w = parsed && parsed > 0 ? parsed : null;
  }
  if (field === 'r') {
    const parsed = value ? parseInt(value) : null;
    set.r = parsed && parsed > 0 ? parsed : null;
  }
  if (field === 'rir') set.rir = value ? parseFloat(value) : null;

  persistData();
  renderWorkoutPage();
}

function persistData() {
  try {
    localStorage.setItem('workoutData', JSON.stringify(workoutData));
  } catch (e) {
    console.error('Failed to save to localStorage:', e);
  }
}

function loadData() {
  try {
    const stored = localStorage.getItem('workoutData');
    if (stored) {
      workoutData = JSON.parse(stored);
    }
  } catch (e) {
    console.error('Failed to load from localStorage:', e);

}

}

function getLastWorkedDate(exName) {
  let latestDate = null;

  for (let key in workoutData) {
    const lastDashIdx = key.lastIndexOf('-');
    const dateStr = key.substring(0, lastDashIdx);
    if (!dateStr) continue;

    const dayExercises = workoutData[key];
    for (let ex of dayExercises) {
      if (ex.name === exName) {
        const completedSet = ex.sets.find(s => s.logged && s.r !== null && s.r > 0);
        if (completedSet) {
          if (!latestDate || dateStr > latestDate) {
            latestDate = dateStr;
          }
        }
      }
    }
  }

  if (latestDate) {
    return new Date(latestDate + 'T00:00:00').toLocaleDateString('en-US', { month: '2-digit', day: '2-digit', year: '2-digit' });
  }

  for (let s of SEED) {
    const ex = s.exercises.find(e => e.name === exName);
    if (ex) {
      return new Date(s.date + 'T00:00:00').toLocaleDateString('en-US', { month: '2-digit', day: '2-digit', year: '2-digit' });
    }
  }

  return null;
}

function checkIfPR(exName, weight, reps) {
  if (weight === null || reps === null || reps <= 0) return false;
  const lastPerf = findLastPerformance(exName);
  if (!lastPerf) return true;
  for (let set of lastPerf.sets) {
    if (set.logged && set.r !== null && set.r > 0) {
      const lastW = set.w || 0;
      if (weight > lastW || (weight === lastW && reps > set.r)) {
        return true;
      }
    }
  }
  return weight > 0 && reps > 0;
}

function findLastPerformance(exName) {
  let latest = null;
  let latestDate = null;

  for (let key in workoutData) {
    const lastDashIdx = key.lastIndexOf('-');
    const dateStr = key.substring(0, lastDashIdx);
    if (!dateStr) continue;

    const dayExercises = workoutData[key];
    for (let ex of dayExercises) {
      if (ex.name === exName) {
        const completedSet = ex.sets.find(s => s.logged && s.r !== null && s.r > 0);
        if (completedSet) {
          if (!latestDate || dateStr > latestDate) {
            latestDate = dateStr;
            latest = ex;
          }
        }
      }
    }
  }

  if (latest) return latest;

  for (let s of SEED) {
    const ex = s.exercises.find(e => e.name === exName);
    if (ex) return ex;
  }

  return null;
}

function findLastWeekPerformance(exName) {
  let latest = null;
  let latestDate = null;

  for (let key in workoutData) {
    const lastDashIdx = key.lastIndexOf('-');
    const dateStr = key.substring(0, lastDashIdx);
    if (!dateStr) continue;

    const dayExercises = workoutData[key];
    for (let ex of dayExercises) {
      if (ex.name === exName) {
        const completedSet = ex.sets.find(s => s.logged && s.r !== null && s.r > 0);
        if (completedSet) {
          if (!latestDate || dateStr > latestDate) {
            latestDate = dateStr;
            latest = ex;
          }
        }
      }
    }
  }

  if (latest) return latest;

  for (let s of SEED) {
    const ex = s.exercises.find(e => e.name === exName);
    if (ex) return ex;
  }

  return null;
}

function getRecommendation(exName, setIdx, lastPerf) {
  if (!lastPerf) return null;
  const exLib = EXERCISE_LIBRARY[exName];
  if (!exLib) return null;

  const prevSetIdx = setIdx - 1;
  const ls = prevSetIdx >= 0 ? lastPerf.sets[prevSetIdx] : lastPerf.sets[setIdx];

  if (!ls || ls.r === null) return null;

  const rir = ls.rir !== null ? ls.rir : 0;

  if (exLib.type === 'bodyweight') {
    const max = 15;
    if (rir < 1) {
      return { w: null, r: ls.r, rir: 0 };
    }
    if (rir < 2) {
      return { w: null, r: ls.r, rir: 1 };
    }
    if (ls.r >= max) {
      return { w: null, r: ls.r + 1, rir: 1 };
    }
    if (rir < 4) {
      return { w: null, r: ls.r + 1, rir: 1 };
    }
    return { w: null, r: Math.min(ls.r + 2, max), rir: 1 };
  }

  const min = exLib.repMin || 8;
  const max = exLib.repMax || 12;
  const incr = exLib.weightIncrement || 5;

  if (rir < 1) {
    return { w: ls.w, r: ls.r, rir: 0 };
  }
  if (rir < 2) {
    return { w: ls.w, r: ls.r, rir: 1 };
  }

  if (ls.r >= max) {
    return { w: ls.w + incr, r: min, rir: 1 };
  }

  if (rir < 4) {
    return { w: ls.w, r: ls.r + 1, rir: 1 };
  }

  return { w: ls.w, r: Math.min(ls.r + 2, max), rir: 1 };
}

function startTimer(sec) {
  clearInterval(timer.intervalId);
  timer.remaining = sec;
  timer.running = true;
  const td = document.getElementById('timerDisplay');
  td.classList.add('active');
  updateTimerDisplay();
  timer.intervalId = setInterval(() => {
    timer.remaining--;
    updateTimerDisplay();
    if (timer.remaining <= 0) {
      clearInterval(timer.intervalId);
      timer.running = false;
      td.classList.remove('active');
      playTimerAlert();
    }
  }, 1000);
}

function updateTimerDisplay() {
  const m = Math.floor(timer.remaining / 60);
  const s = timer.remaining % 60;
  document.getElementById('timerTime').textContent = `${m}:${s.toString().padStart(2, '0')}`;
}

function playTimerAlert() {
  if (navigator.vibrate) {
    navigator.vibrate([200, 100, 200]);
  }
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.frequency.setValueAtTime(800, now);
  osc.frequency.setValueAtTime(600, now + 0.15);
  gain.gain.setValueAtTime(0.3, now);
  gain.gain.setValueAtTime(0, now + 0.3);
  osc.start(now);
  osc.stop(now + 0.3);
}

function toggleTimer() {
  if (timer.running) {
    clearInterval(timer.intervalId);
    timer.running = false;
  } else {
    timer.running = true;
    timer.intervalId = setInterval(() => {
      timer.remaining--;
      updateTimerDisplay();
      if (timer.remaining <= 0) {
        clearInterval(timer.intervalId);
        timer.running = false;
        document.getElementById('timerDisplay').classList.remove('active');
      }
    }, 1000);
  }
}

function exportWorkoutData() {
  const backup = {
    exportedAt: new Date().toISOString(),
    bodyWeight,
    workoutData
  };
  const json = JSON.stringify(backup, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `workout-backup-${new Date().toISOString().split('T')[0]}.json`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);

function importWorkoutData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const backup = JSON.parse(e.target.result);
      if (backup.workoutData) {
        workoutData = backup.workoutData;
        if (backup.bodyWeight) bodyWeight = backup.bodyWeight;
        persistData();
        loadSettings();
        loadWorkout();
        renderWorkoutPage();
        alert('Workout data imported successfully!');
      } else {
        alert('Invalid backup file format');
      }
    } catch (err) {
      alert('Error reading file: ' + err.message);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function getVolumeTrend() {
  const volumeByDate = {};
  for (let key in workoutData) {
    const lastDashIdx = key.lastIndexOf('-');
    const dateStr = key.substring(0, lastDashIdx);
    if (!dateStr) continue;
    const dayExercises = workoutData[key];
    let dayVolume = 0;
    for (let ex of dayExercises) {
      for (let set of ex.sets) {
        if (set.logged && set.r && set.r > 0) {
          const w = set.w || 0;
          dayVolume += w * set.r;
        }
      }
    }
    if (dayVolume > 0) volumeByDate[dateStr] = dayVolume;
  }
  return Object.entries(volumeByDate).sort((a, b) => a[0].localeCompare(b[0]));
}

function renderVolumeTrend(trend) {
  if (trend.length === 0) return `<div style="color: #666; font-size: 12px;">No data yet</div>`;
  const max = Math.max(...trend.map(t => t[1]));
  let html = `<div style="display: flex; gap: 3px; height: 80px; align-items: flex-end; padding: 8px; background: #111; border-radius: 3px;">`;
  for (let [date, vol] of trend) {
    const h = (vol / max * 100);
    html += `<div style="flex: 1; background: #2563eb; height: ${h}%; min-height: 2px; border-radius: 1px;" title="${date}: ${Math.round(vol)} volume"></div>`;
  }
  html += `</div>`;
  return html;
}

function getBestLifts() {
  const bestByEx = {};
  for (let key in workoutData) {
    const lastDashIdx = key.lastIndexOf('-');
    const dateStr = key.substring(0, lastDashIdx);
    const dayExercises = workoutData[key];
    for (let ex of dayExercises) {
      if (!bestByEx[ex.name]) bestByEx[ex.name] = { weight: 0, reps: 0, date: null };
      for (let set of ex.sets) {
        if (set.logged && set.r && set.r > 0) {
          const w = set.w || 0;
          if (w > bestByEx[ex.name].weight || (w === bestByEx[ex.name].weight && set.r > bestByEx[ex.name].reps)) {
            bestByEx[ex.name] = { weight: w, reps: set.r, date: dateStr };
          }
        }
      }
    }
  }
  for (let s of SEED) {
    for (let ex of s.exercises) {
      if (!bestByEx[ex.name]) bestByEx[ex.name] = { weight: 0, reps: 0, date: s.date };
      const set = ex.sets[0];
      if (set && set.r) {
        const w = set.w || 0;
        if (w > bestByEx[ex.name].weight || (w === bestByEx[ex.name].weight && set.r > bestByEx[ex.name].reps)) {
          bestByEx[ex.name] = { weight: w, reps: set.r, date: s.date };
        }
      }
    }
  }
  return Object.entries(bestByEx).sort((a, b) => (b[1].weight * b[1].reps) - (a[1].weight * a[1].reps)).slice(0, 5);
}

function getVolumeByType() {
  const volByType = { 'Upper A': 0, 'Upper B': 0, 'Lower A': 0, 'Lower B': 0 };
  const countByType = { 'Upper A': 0, 'Upper B': 0, 'Lower A': 0, 'Lower B': 0 };

  for (let key in workoutData) {
    const lastDashIdx = key.lastIndexOf('-');
    const dayName = key.substring(lastDashIdx + 1);
    const dayExercises = workoutData[key];
    for (let ex of dayExercises) {
      for (let set of ex.sets) {
        if (set.logged && set.r && set.r > 0) {
          volByType[dayName] = (volByType[dayName] || 0) + (set.w || 0) * set.r;
          countByType[dayName] = (countByType[dayName] || 0) + 1;
        }
      }
    }
  }
  return { volByType, countByType };
}

function renderVolumeByType(data) {

    html += `<div style="color: #60a5fa; font-weight: 600;">${Math.round(vol)}</div>`;

  html += `</div>`;
  return html;
}

function getRecentSessions() {

    const dayName = key.substring(lastDashIdx + 1);
    const dayExercises = workoutData[key];
    let sessionVol = 0, reps = 0, maxW = 0;
    for (let ex of dayExercises) {
      for (let set of ex.sets) {
        if (set.logged && set.r && set.r > 0) {
          sessionVol += (set.w || 0) * set.r;
          reps += set.r;
          maxW = Math.max(maxW, set.w || 0);
        }
      }
    }
    if (sessionVol > 0) sessions.push({ dateStr, dayName, volume: sessionVol, reps, maxWeight: maxW });
  }
  return sessions.sort((a, b) => b.dateStr.localeCompare(a.dateStr)).slice(0, 5);
}

function renderSessions(sessions) {
  if (sessions.length === 0) return `<div style="color: #666; font-size: 12px;">No sessions yet</div>`;
  let html = `<div style="font-size: 12px;">`;
  for (let s of sessions) {
    html += `<div style="margin: 6px 0; padding: 8px; background: #1a1a1a; border-radius: 3px; display: flex; justify-content: space-between; align-items: center;">`;
    html += `<div><strong>${s.dayName}</strong> • ${s.dateStr}</div>`;
    html += `<div style="color: #999;">Vol: <span style="color: #60a5fa;">${Math.round(s.volume)}</span> • ${s.reps} reps • Max: <span style="color: #10b981;">${s.maxWeight} lbs</span></div>`;
    html += `</div>`;
  }
  html += `</div>`;
  return html;
}

function getWorkoutStreak() {
  const dates = Object.keys(workoutData).map(key => key.substring(0, key.lastIndexOf('-'))).filter((v, i, a) => a.indexOf(v) === i);
  if (dates.length === 0) return { streak: 0, lastDate: null };
  dates.sort((a, b) => b.localeCompare(a));
  let streak = 0, current = new Date(todayISO());
  for (let i = 0; i < 365; i++) {
    const checkDate = new Date(current);
    checkDate.setDate(checkDate.getDate() - i);
    const dateStr = checkDate.getFullYear() + '-' + String(checkDate.getMonth() + 1).padStart(2, '0') + '-' + String(checkDate.getDate()).padStart(2, '0');
    if (dates.includes(dateStr)) streak++;
    else if (streak > 0) break;
  }
  return { streak, lastDate: dates[0] };
}

function renderStreakCard() {
  const { streak } = getWorkoutStreak();
  return `<div style="margin-bottom: 16px; padding: 20px; background: linear-gradient(135deg, #2563eb, #1e40af); border-radius: 8px; text-align: center;">
    <div style="font-size: 44px; font-weight: 700; color: #fff; line-height: 1;">${streak}</div>
    <div style="font-size: 12px; color: #ccc; margin-top: 6px;">Days in a Row 🔥</div>
  </div>`;
}

function getStatsData() {
  let totalSessions = 0, totalVolume = 0, totalReps = 0;
  for (let key in workoutData) {
    const dayExercises = workoutData[key];
    let dayHasData = false;
    for (let ex of dayExercises) {
      for (let set of ex.sets) {
        if (set.logged && set.r && set.r > 0) {
          totalVolume += (set.w || 0) * set.r;
          totalReps += set.r;
          dayHasData = true;
        }
      }
    }
    if (dayHasData) totalSessions++;
  }
  for (let s of SEED) {
    let dayHasData = false;
    for (let ex of s.exercises) {
      for (let set of ex.sets) {
        if (set.r && set.r > 0) {
          totalVolume += (set.w || 0) * set.r;
          totalReps += set.r;
          dayHasData = true;
        }
      }
    }
    if (dayHasData) totalSessions++;
  }
  return { sessions: totalSessions, volume: totalVolume, reps: totalReps };
}

function renderStatsGrid() {
  const { sessions, volume, reps } = getStatsData();
  return `<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 8px; margin-bottom: 16px;">
    <div style="padding: 12px; background: #0d0d0d; border-radius: 4px; text-align: center; border: 1px solid #2a2a2a;">
      <div style="font-size: 20px; font-weight: 700; color: #2563eb;">${sessions}</div>
      <div style="font-size: 10px; color: #888; margin-top: 4px;">Sessions</div>
    </div>
    <div style="padding: 12px; background: #0d0d0d; border-radius: 4px; text-align: center; border: 1px solid #2a2a2a;">
      <div style="font-size: 20px; font-weight: 700; color: #10b981;">${(volume / 1000).toFixed(1)}K</div>
      <div style="font-size: 10px; color: #888; margin-top: 4px;">Total Vol</div>
    </div>
    <div style="padding: 12px; background: #0d0d0d; border-radius: 4px; text-align: center; border: 1px solid #2a2a2a;">
      <div style="font-size: 20px; font-weight: 700; color: #f59e0b;">${reps}</div>
      <div style="font-size: 10px; color: #888; margin-top: 4px;">Reps Total</div>
    </div>
  </div>`;
}

function renderPRCards() {
  const bestLifts = getBestLifts().slice(0, 3);
  if (bestLifts.length === 0) return `<div style="margin-bottom: 16px; color: #666; font-size: 12px;">No PRs yet</div>`;
  let html = `<div style="margin-bottom: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px;">`;
  for (let [name, data] of bestLifts) {
    html += `<div style="padding: 12px; background: #1a2a1a; border-left: 3px solid #10b981; border-radius: 4px;">
      <div style="font-size: 11px; color: #888; margin-bottom: 4px;">${name}</div>
      <div style="font-size: 18px; font-weight: 700; color: #10b981;">${data.weight || 'BW'}</div>
      <div style="font-size: 11px; color: #666; margin-top: 4px;">× ${data.reps}</div>
    </div>`;
  }
  html += `</div>`;
  return html;
}

function renderExerciseCurves() {
  const exerciseData = {};
  for (let key in workoutData) {
    const dateStr = key.substring(0, key.lastIndexOf('-'));
    const dayExercises = workoutData[key];
    for (let ex of dayExercises) {
      if (!exerciseData[ex.name]) exerciseData[ex.name] = [];
      const maxSet = ex.sets.reduce((max, s) => !max || (s.logged && s.w > (max.w || 0)) ? s : max, null);
      if (maxSet && maxSet.logged) exerciseData[ex.name].push({ date: dateStr, w: maxSet.w || 0, r: maxSet.r });
    }
  }
  for (let s of SEED) {
    for (let ex of s.exercises) {
      if (!exerciseData[ex.name]) exerciseData[ex.name] = [];
      const maxSet = ex.sets[0];
      if (maxSet && maxSet.r) exerciseData[ex.name].push({ date: s.date, w: maxSet.w || 0, r: maxSet.r });
    }
  }

  let html = `<div style="margin-bottom: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px;">`;
  for (let [name, points] of Object.entries(exerciseData).slice(0, 4)) {
    const sorted = points.sort((a, b) => a.date.localeCompare(b.date));
    const trend = sorted.length > 1 ? (sorted[sorted.length - 1].w - sorted[0].w) : 0;
    const trendIcon = trend > 0 ? '↑' : trend < 0 ? '↓' : '→';
    const trendColor = trend > 0 ? '#10b981' : trend < 0 ? '#ef4444' : '#888';
    html += `<div style="padding: 10px; background: #0d0d0d; border-radius: 4px; border: 1px solid #2a2a2a;">
      <div style="font-size: 11px; color: #888; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${name}</div>
      <svg viewBox="0 0 80 30" style="width: 100%; height: 30px;">
        ${sorted.map((p, i) => {
          const x = (i / (sorted.length - 1 || 1)) * 70 + 5;
          const maxW = Math.max(...sorted.map(s => s.w), 1);
          const y = 25 - (p.w / maxW) * 20;
          return `<circle cx="${x}" cy="${y}" r="2" fill="#2563eb" />`;
        }).join('')}
      </svg>
      <div style="font-size: 12px; font-weight: 600; color: #60a5fa; margin-top: 4px;">${sorted[sorted.length - 1]?.w || 0} lbs</div>
      <div style="font-size: 10px; color: ${trendColor}; margin-top: 2px;">${trendIcon} ${Math.abs(trend).toFixed(1)} lbs</div>
    </div>`;
  }
  html += `</div>`;
  return html;
}

function estimateOneRM(weight, reps) {
  if (reps === 1) return weight;
  return Math.round(weight * (1 + reps / 30) * 10) / 10;
}

function renderEstimated1RM() {
  const bestLifts = getBestLifts().slice(0, 3);
  if (bestLifts.length === 0) return `<div style="margin-bottom: 16px; color: #666; font-size: 12px;">No lifts logged yet</div>`;
  let html = `<div style="margin-bottom: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px;">`;
  for (let [name, data] of bestLifts) {
    const oneRM = estimateOneRM(data.weight, data.reps);
    html += `<div style="padding: 10px; background: #1a1a2a; border-radius: 4px; border: 1px solid #2a2a4a;">
      <div style="font-size: 10px; color: #666; margin-bottom: 4px;">Est. 1RM</div>
      <div style="font-size: 16px; font-weight: 700; color: #60a5fa;">${oneRM}</div>
      <div style="font-size: 10px; color: #888; margin-top: 3px;">${name}</div>
    </div>`;
  }
  html += `</div>`;
  return html;
}

function getMuscleGroupStats() {
  const stats = {};
  for (let exName in EXERCISE_LIBRARY) {
    const ex = externalExercises.find(e => e.name.toLowerCase() === exName.toLowerCase());
    if (!ex || !ex.primaryMuscles) continue;
    const muscle = ex.primaryMuscles[0];
    if (!stats[muscle]) stats[muscle] = 0;
    for (let key in workoutData) {
      const dayEx = workoutData[key].find(e => e.name === exName);
      if (dayEx) {
        for (let set of dayEx.sets) {
          if (set.logged && set.r && set.r > 0) stats[muscle] += (set.w || 0) * set.r;
        }
      }
    }
  }
  return Object.entries(stats).sort((a, b) => b[1] - a[1]);
}

function renderMuscleGroupDist() {
  const muscleData = getMuscleGroupStats();
  if (muscleData.length === 0) return `<div style="margin-bottom: 16px; color: #666; font-size: 12px;">No muscle group data</div>`;
  const total = muscleData.reduce((sum, [_, vol]) => sum + vol, 0);
  const colors = ['#2563eb', '#10b981', '#f59e0b', '#ec4899', '#8b5cf6', '#06b6d4'];
  let html = `<div style="margin-bottom: 16px; padding: 12px; background: #0d0d0d; border-radius: 4px; border: 1px solid #2a2a2a;">`;
  html += `<div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; font-size: 11px; margin-bottom: 12px;">`;
  for (let i = 0; i < muscleData.length; i++) {
    const [muscle, vol] = muscleData[i];
    const pct = ((vol / total) * 100).toFixed(0);
    html += `<div style="display: flex; align-items: center; gap: 6px;">
      <div style="width: 10px; height: 10px; background: ${colors[i % colors.length]}; border-radius: 2px;"></div>
      <span>${muscle}: <span style="color: #60a5fa; font-weight: 600;">${pct}%</span></span>
    </div>`;
  }
  html += `</div>`;
  return html;
}

function getWeeklySummary() {
  const weeks = {};
  for (let key in workoutData) {
    const date = new Date(key.substring(0, key.lastIndexOf('-')) + 'T00:00:00');
    const weekStart = new Date(date);
    weekStart.setDate(weekStart.getDate() - weekStart.getDay());
    const weekKey = weekStart.toISOString().split('T')[0];
    if (!weeks[weekKey]) weeks[weekKey] = { volume: 0, sessions: 0, reps: 0 };
    let hasData = false;
    const dayEx = workoutData[key];
    for (let ex of dayEx) {
      for (let set of ex.sets) {
        if (set.logged && set.r && set.r > 0) {
          weeks[weekKey].volume += (set.w || 0) * set.r;
          weeks[weekKey].reps += set.r;
          hasData = true;
        }
      }
    }
    if (hasData) weeks[weekKey].sessions++;
  }
  return Object.entries(weeks).sort((a, b) => b[0].localeCompare(a[0])).slice(0, 4);
}

function renderWeeklySummary(weeks) {
  if (weeks.length === 0) return `<div style="color: #666; font-size: 12px;">No weekly data</div>`;
  let html = `<div style="display: grid; gap: 8px;">`;
  for (let [week, data] of weeks) {
    const date = new Date(week + 'T00:00:00');
    const label = `Week of ${(date.getMonth() + 1)}/${date.getDate()}`;
    html += `<div style="padding: 10px; background: #111; border-radius: 3px; display: flex; justify-content: space-between;">
      <div style="font-size: 12px; color: #e0e0e0;">${label}</div>
      <div style="font-size: 11px; color: #999;">Vol: <span style="color: #60a5fa;">${(data.volume/1000).toFixed(1)}K</span> • ${data.sessions} sessions</div>
    </div>`;
  }
  html += `</div>`;
  return html;
}

let swapExerciseIndex = null;

function swapExercise(exIdx) {
  swapExerciseIndex = exIdx;
  const exData = workoutData[`${todayISO()}-${currentDay}`];
  const currentName = exData[exIdx].name;
  const alternatives = getExerciseAlternatives(currentName);

  let html = `<p style="color: #999; margin-bottom: 16px;">Current: <strong>${currentName}</strong></p>`;

  if (alternatives.length === 0) {
    html += `<p style="color: #666;">No alternatives found in database for this exercise.</p>`;
  } else {
    html += `<p style="color: #999; margin-bottom: 12px;">Select an alternative that targets the same muscle group:</p>`;
    html += `<div style="display: grid; gap: 8px;">`;
    alternatives.forEach(alt => {
      html += `<button class="modal-btn" onclick="performExerciseSwap('${alt}')" style="text-align: left; background: #0d0d0d; border: 1px solid #2a2a2a;">`;
      html += `${alt}`;
      html += `</button>`;
    });
    html += `</div>`;
  }

  document.getElementById('swapExerciseContent').innerHTML = html;
  document.getElementById('swapExerciseModal').style.display = 'flex';
}

function closeSwapModal() {
  document.getElementById('swapExerciseModal').style.display = 'none';
  swapExerciseIndex = null;
}

function performExerciseSwap(newExerciseName) {
  if (swapExerciseIndex === null) return;
  const exData = workoutData[`${todayISO()}-${currentDay}`];
  exData[swapExerciseIndex].name = newExerciseName;
  persistData();
  closeSwapModal();
  renderWorkoutPage();
}

async function handleAuth() {
  if (!sbClient) return alert('Supabase not loaded. Refresh the page.');
  if (currentUser) {
    await sbClient.auth.signOut();
    currentUser = null;
    document.getElementById('authBtn').textContent = 'Sign in';
    workoutData = {};
    render();
  } else {
    const { data, error } = await sbClient.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.origin }
    });
    if (error) console.error('Auth error:', error);
  }
}

async function initAuth() {
  if (!sbClient) return;
  const { data: { session } } = await sbClient.auth.getSession();
  if (session?.user) {
    currentUser = session.user;
    document.getElementById('authBtn').textContent = 'Sign out';
    await loadDataFromSupabase();
  } else {
    document.getElementById('authBtn').textContent = 'Sign in';
  }
}

async function loadDataFromSupabase() {
  if (!currentUser) return;
  const { data, error } = await supabase
    .from('workouts')
    .select('*')
    .eq('user_id', currentUser.id);
  if (error) { console.error('Load error:', error); return; }
  workoutData = {};
  data?.forEach(row => {
    workoutData[row.workout_key] = row.data;
  });
  localStorage.setItem('workoutData', JSON.stringify(workoutData));
  render();
}

async function syncDataToSupabase() {
  if (!currentUser) return;
  for (const [key, data] of Object.entries(workoutData)) {
    const { error } = await supabase
      .from('workouts')
      .upsert({ user_id: currentUser.id, workout_key: key, data }, { onConflict: 'user_id,workout_key' });
    if (error) console.error('Sync error:', error);
  }
}

function setupAuth() {
  if (sbClient) {
    sbClient.auth.onAuthStateChange((event, session) => {
      if (session?.user) {
        currentUser = session.user;
        document.getElementById('authBtn').textContent = 'Sign out';
        loadDataFromSupabase();
      } else {
        currentUser = null;
        document.getElementById('authBtn').textContent = 'Sign in';
      }
    });
    initAuth();
  }
}

init();

setTimeout(() => {
  if (!sbClient && window.supabase) {
    sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    setupAuth();
  } else if (sbClient) {
    setupAuth();
  }
}, 500);
</script>
